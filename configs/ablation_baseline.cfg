dataset:
  cifake_path: ./datasets/cifake
  labels: 2
  name: cifake

model:
  add_magnitude_channel: false
  add_fft_channel: false
  add_lbp_channel: false
  add_gabor_channel: false
  backbone: MobileNetV3-Small
  freeze_backbone: true

train:
  accumulation_batches: 4
  batch_size: 32
  epoch_num: 10
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  mixed_precision: true
  resolution: 224
  seed: 5

test:
  batch_size: 32
  limit_test_batches: 1.0
  mixed_precision: true
  resolution: 224
  seed: 5
  weights_path: ./final_trained/cifake_20260525_1426_ablation_baseline/checkpoints/cifake_MobileNetV3-Small_epoch=9-train_acc=0.88-val_acc=0.89.ckpt